<div class="assessment-menu" data-assessment-menu>
  <button
    class="assessment-menu__trigger"
    type="button"
    id="assessment-menu-trigger"
    aria-expanded="false"
    aria-controls="assessment-menu-panel"
    data-assessment-menu-trigger
  >
    <span>Assessment</span>
    <span aria-hidden="true">&#9662;</span>
  </button>
  <div
    class="assessment-menu__panel"
    id="assessment-menu-panel"
    role="region"
    aria-labelledby="assessment-menu-trigger"
    data-assessment-menu-panel
    hidden
  >
    <a href="{{ url_for('index') }}#saved-assessments">Save</a>
    <a href="{{ url_for('index') }}#saved-assessments">Open</a>
    <form method="post" action="{{ url_for('index') }}">
      <input type="hidden" name="action" value="export_assessment" />
      <button
        type="submit"
        class="workspace-action workspace-action--secondary"
        data-assessment-export
      >Export current assessment</button>
    </form>
    <form method="post" action="{{ url_for('index') }}" enctype="multipart/form-data">
      <input type="hidden" name="action" value="import_assessment" />
      <input
        type="file"
        name="assessment_file"
        accept=".json,application/json"
        hidden
        onchange="this.form.submit()"
      />
      <button
        type="button"
        class="workspace-action workspace-action--secondary"
        data-assessment-import
        onclick="this.form.elements.assessment_file.click()"
      >Import assessment</button>
    </form>
  </div>
</div>
